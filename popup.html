<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>YT AI Image Swap</title><style>
body{font:13px system-ui,sans-serif;width:300px;margin:0;padding:14px;background:#111;color:#eee}
h1{font-size:15px;margin:0 0 10px}.hint{color:#aaa;font-size:12px;line-height:1.45;margin-bottom:12px}
button{width:100%;padding:9px;margin:5px 0;border:0;border-radius:7px;background:#2b2b2b;color:#fff;cursor:pointer}button.primary{background:#ff0033}
#status{white-space:pre-wrap;color:#9f9;font-size:12px;margin-top:8px}
</style></head><body>
<h1>YT Studio AI Image Swap</h1>
<div class="hint">動画編集画面で使います。ページ上の画像を検出して保存し、ローカル画像をYouTube Studioの画像入力へ渡します。</div>
<button id="scan" class="primary">AI画像をスキャン</button>
<button id="download">選択画像をダウンロード</button>
<button id="replace">画像を選択して差し替え</button>
<div id="status">準備完了</div><script src="popup.js"></script></body></html>
